[package]
name = "galileo-web"
version = "0.1.0"
edition = "2021"
publish = false

# Trunk wrapper for the Galileo lab (same pattern as physics3d-web). The
# example file is included verbatim; the egui feature comes in via the
# index.html rust asset (data-features).

[dependencies]
kiss3d = { path = "../.." }
egui = "0.36"
physicsplay-core = { path = "../../physicsplay-core", features = ["serialize"] }
env_logger = "0.11"
web-time = "1"

[features]
default = ["egui"]
egui = ["kiss3d/egui"]

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement"] }
